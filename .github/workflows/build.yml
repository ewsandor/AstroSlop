name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PEBBLE_SDK_VERSION: "4.44"
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # pebble-tool supports Python 3.10-3.13

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g libsndio7.0

      - uses: astral-sh/setup-uv@v5

      - name: Install pebble tool
        run: uv tool install pebble-tool

      - name: Cache Pebble SDK
        id: sdk_cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-${{ runner.os }}-${{ env.PEBBLE_SDK_VERSION }}

      - name: Install Pebble SDK
        if: steps.sdk_cache.outputs.cache-hit != 'true'
        run: pebble sdk install "$PEBBLE_SDK_VERSION"

      - name: Install npm dependencies
        run: npm ci

      - name: Build
        run: pebble build

      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.meta.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.meta.outputs.version }}" >&2
            exit 1
          fi

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp build/*.pbw "dist/astroslop-${{ steps.meta.outputs.version }}.pbw"

      - uses: actions/upload-artifact@v4
        with:
          name: pbw
          path: dist/*.pbw
          if-no-files-found: error


  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Host C tests
        run: make -C test/astro
      - name: Tool tests
        run: python3 -m unittest discover -s test/tools -v
      - name: Companion tests
        run: node test/pkjs/companion.test.js


  # The only job with contents: write; keeps a permanent copy of every released .pbw.
  release:
    if: github.ref_type == 'tag'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pbw
          path: dist
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pbw
          generate_release_notes: true

  # Like Core Devices' publishing workflow, check the store before requesting a deployment.
  plan:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      app_id: ${{ steps.check.outputs.app_id }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check appstore version
        id: check
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          UUID=$(jq -er '.pebble.uuid | select(type == "string" and length > 0) | ascii_downcase' package.json)
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://appstore-api.repebble.com" | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$TOKEN"
          APP=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
            "https://appstore-api.repebble.com/api/v1/developer/me" | \
            jq -ce --arg uuid "$UUID" '
              [.apps[] | select((.app_uuid // "" | ascii_downcase) == $uuid)] |
              if length == 1 then .[0] else error("Expected one appstore listing for the app UUID") end |
              if (.app_id | type == "string" and length > 0) and
                 (.versions | type == "array" and all(.[]; type == "string"))
              then . else error("Appstore response is missing an app ID or versions") end')
          echo "app_id=$(jq -r '.app_id' <<<"$APP")" >> "$GITHUB_OUTPUT"
          if jq -e --arg version "$VERSION" '.versions | index($version) != null' <<<"$APP" >/dev/null; then
            echo "Version $VERSION already exists in the appstore; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is new; requesting publication."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Configure the `Pebble Appstore` environment for main and require approval.
  publish:
    if: needs.plan.outputs.publish == 'true'
    needs: [build, test, plan]
    runs-on: ubuntu-latest
    environment: Pebble Appstore
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pbw
          path: dist
      - name: Publish release to the Pebble appstore
        env:
          APP_ID: ${{ vars.APPSTORE_APP_ID }}
          PLANNED_APP_ID: ${{ needs.plan.outputs.app_id }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$APP_ID" || { echo "Set the APPSTORE_APP_ID environment variable" >&2; exit 1; }
          test "$APP_ID" = "$PLANNED_APP_ID" || { echo "APPSTORE_APP_ID does not match the app UUID" >&2; exit 1; }
          TOKEN=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://appstore-api.repebble.com" | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$TOKEN"
          curl --fail-with-body -sS -H "Authorization: Bearer $TOKEN" \
            --form-string "version=$VERSION" \
            -F "pbwFile=@dist/astroslop-$VERSION.pbw" \
            --form-string isPublished=true \
            "https://appstore-api.repebble.com/api/dashboard/apps/$APP_ID/releases"
